<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Lord Rising</title>
  <meta name="description" content="Robot Lord Rising — coming soon.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #0a0c12;
      --bg-2: #11151f;
      --accent: #ff4d2e;
      --accent-soft: #ff7a5c;
      --ink: #e9edf5;
      --muted: #8a93a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 60%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 640px; }
    .eyebrow {
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--accent);
      margin-bottom: 1.4rem;
      font-weight: 700;
    }
    h1 {
      font-size: clamp(2.4rem, 8vw, 4.6rem);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 1.2rem;
      background: linear-gradient(180deg, #ffffff 0%, #c9d0de 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tagline {
      color: var(--muted);
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      line-height: 1.6;
      margin-bottom: 2.4rem;
    }
    .rule {
      width: 64px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      border-radius: 2px;
      margin: 0 auto 2.4rem;
    }
    .soon {
      display: inline-block;
      border: 1px solid rgba(255,77,46,0.4);
      color: var(--accent-soft);
      padding: 0.55rem 1.2rem;
      border-radius: 999px;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
    }
    footer {
      position: fixed;
      bottom: 1.4rem;
      left: 0; right: 0;
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Robot Lord Rising</p>
    <h1>Something is being built.</h1>
    <div class="rule"></div>
    <p class="tagline">The new home of Robot Lord Rising is under construction. Check back soon.</p>
    <span class="soon">Coming Soon</span>
  </main>
  <footer>&copy; 2026 Robot Lord Rising</footer>
</body>
</html>
